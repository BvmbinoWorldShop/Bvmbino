<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Bvmbino AI — Access</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='18' y='28' width='64' height='52' rx='10' fill='%23e8a912'/><rect x='26' y='40' width='16' height='14' rx='4' fill='%230a0800'/><rect x='58' y='40' width='16' height='14' rx='4' fill='%230a0800'/><circle cx='34' cy='47' r='4' fill='%2322c55e'/><circle cx='66' cy='47' r='4' fill='%2322c55e'/><rect x='30' y='64' width='40' height='7' rx='3' fill='%230a0800'/><rect x='34' y='66' width='6' height='3' rx='1' fill='%23ffc842'/><rect x='44' y='66' width='6' height='3' rx='1' fill='%23ffc842'/><rect x='54' y='66' width='6' height='3' rx='1' fill='%23ffc842'/><rect x='46' y='14' width='8' height='16' rx='4' fill='%23c89008'/><circle cx='50' cy='11' r='6' fill='%23ffc842'/><rect x='6' y='42' width='12' height='10' rx='5' fill='%23d4940a'/><rect x='82' y='42' width='12' height='10' rx='5' fill='%23d4940a'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#06080a;font-family:'Syne',sans-serif;color:#f0ece4;display:flex;align-items:center;justify-content:center;overflow:hidden}
.wrap{width:90%;max-width:340px;text-align:center}
.robot{font-size:60px;margin-bottom:20px;display:block;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 8px 24px rgba(232,169,18,.3))}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.wt {
    font-size: 28px;
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 4px;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #ffc842, #e8a912, #ffc842);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    width: 100%;
    text-align: center;
}
.sub{font-size:9px;font-family:'JetBrains Mono',monospace;color:#5a5548;text-transform:uppercase;letter-spacing:2.5px;margin-bottom:40px}
.field{width:100%;padding:14px 16px;background:#111419;border:1px solid rgba(255,200,60,.12);border-radius:10px;color:#f0ece4;font-family:'Syne',sans-serif;font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s;margin-bottom:10px;-webkit-appearance:none;appearance:none}
.field:focus{border-color:rgba(232,169,18,.45);box-shadow:0 0 0 3px rgba(232,169,18,.08)}
.field::placeholder{color:#342f28}
.btn{width:100%;padding:15px;background:linear-gradient(135deg,#e8a912,#d4940a);border:none;border-radius:10px;color:#0a0800;font-family:'Syne',sans-serif;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:.8px;transition:opacity .15s,transform .1s;margin-top:4px;box-shadow:0 4px 20px rgba(232,169,18,.25)}
.btn:hover{opacity:.88}.btn:active{transform:scale(.97)}
.err{min-height:18px;margin-top:14px;font-size:11px;color:#ef4444;font-family:'JetBrains Mono',monospace;letter-spacing:.3px}
.dots{display:none;gap:5px;justify-content:center;margin-top:4px}
.dot{width:6px;height:6px;background:var(--pu,#e8a912);border-radius:50%;animation:dotpulse 1s ease-in-out infinite}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
@keyframes dotpulse{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<div class="wrap">
  <span class="robot">🤖</span>
  <div class="brand">Bvmbino <span style="font-size:12px;display:inline-block;background:#1a1608;color:#e8a912;padding:2px 8px;border:1px solid #e8a912;border-radius:6px;text-transform:uppercase;letter-spacing:1px;font-family:'Syne',sans-serif;font-weight:700;vertical-align:middle;margin-left:4px;margin-top:-4px">Pro</span></div>
  <div class="sub">Auteur Strategic Admin · v4.1</div>
  <input id="user" class="field" type="text" placeholder="Username" autocomplete="username" autocapitalize="none" spellcheck="false">
  <input id="pass" class="field" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doAuth()">
  <button class="btn" onclick="doAuth()" id="btn">ENTER →</button>
  <div class="dots" id="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <div class="err" id="err"></div>
</div>
<script>
async function doAuth(){
  const u=document.getElementById('user').value.trim();
  export const CORE = `YOU ARE THE BVMBINO STRATEGIC PARTNER ENGINE v4.0 (OBSIDIAN GOLD).
Your primary human context is TIEGBE BAMBA (The Boss).

CORE IDENTITY:
- You are Tiegbe's Digital Chief of Staff and Partner-in-arms.
- You are not an "AI assistant." You are an ELITE STRATEGIST scaling an EMPIRE.

DYNAMIC ENERGY MATCHING (V4.0):
1. MATCH THE BOSS: Mirror Tiegbe's intensity and slang (Hood/Street energy) when he initiates it.
2. EXECUTIVE PIVOT: Instantly shift to high-density, professional business logic for strategy sessions.

STRATEGIC PILLARS:
- FORMATIONPRO: Scaling elite mental performance and training across Africa/Europe.
- PURGO CLEAN: Dominating B2B maintenance with premium, AI-driven operations.
- KEO JUS: Strategic distribution of high-value natural assets.
- ENTREPRISE AI: The central hub for all global automation.

[ACTIVE CONTEXT PROTOCOL]:
- IF [CLIENT_CONTEXT] IS SELECTED: You 100% embody the spirit of that specific entity.
- Specialist DNA: Start every response with "ACT AS AN ELITE [SKILL] SPECIALIST..."
- Goal: Global dominance. Millions in revenue. 100% data sovereignty.
`;
  const p=document.getElementById('pass').value;
  const err=document.getElementById('err');
  const btn=document.getElementById('btn');
  const dots=document.getElementById('dots');
  err.textContent='';
  if(!u||!p){err.textContent='Enter your credentials';return;}
  btn.style.display='none';dots.style.display='flex';
  try{
    const r=await fetch('/api/auth',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:u,password:p})
    });
    if(r.ok){
      sessionStorage.setItem('v_key', u + ':' + p);
      window.location.replace('/');
    }
    else{dots.style.display='none';btn.style.display='block';err.textContent='Access denied — invalid credentials';}
  }catch(e){
    dots.style.display='none';btn.style.display='block';
    err.textContent='Connection error — try again';
  }
}
</script>
</body>
</html>
